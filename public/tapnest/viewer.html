<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:system-ui;width:100%;height:100%;overflow:hidden}#pet{width:100%;height:65%;touch-action:none}#bubble{position:absolute;top:60%;left:5%;width:90%;max-height:28%;overflow:auto;border-radius:15px;background:#f6fff6ed;border:1px solid #b5d6b8;color:#315f43;padding:9px;font-size:13px;white-space:pre-wrap;display:none}#bar{position:absolute;bottom:0;width:100%;display:flex;gap:4px}select,button,input{border:1px solid #b5d6b8;border-radius:10px;background:#f8fff9;color:#315f43;padding:6px;min-width:0}select{max-width:46%}#chat{position:absolute;bottom:10%;left:2%;width:96%;display:none;gap:3px}input{flex:1;width:50px}#note{position:absolute;top:4px;left:4px;font-size:11px;color:#58725e;pointer-events:none}</style>
<canvas id="pet"></canvas><div id="note">等待糯米机同步模型…</div><div id="bubble"></div><div id="typing" role="status" aria-label="正在回复" style="display:none;position:absolute;right:8%;top:57%;z-index:8;background:#eff9ee;border:1px solid #b5d6b8;border-radius:10px;padding:2px 10px;color:#315f43">…</div><form id="chat"><input id="message" maxlength="1000" placeholder="和角色说句话"><button>发送</button><button type="button" id="cancel">取消</button></form><div id="bar"><select id="forms" aria-label="切换形态"></select><button id="say">💬</button><button id="hide">收起气泡</button></div><script src="engine.js"></script><script>
(function(){const engine=TapNestEngine.make(document.getElementById('pet')),out=[],bubble=document.getElementById('bubble'),chat=document.getElementById('chat'),select=document.getElementById('forms'),input=document.getElementById('message');let payload=null,timer,lastTap=0,burstAt=0,burstCount=0,started=false,drag=false,down,loadState={revision:'',status:'idle',error:''};
function emit(kind,text,formId){if(!payload)return;const e={kind,text:text||'',formId:formId||engine.formId,at:Date.now(),tapCount:kind==='tap'?burstCount:undefined};out.push(e);if(out.length>25)out.shift();parent!==window&&parent.postMessage({type:'tapnest-event',event:e},'*');}
let thinkingNow=false;function thinking(on){thinkingNow=!!on;document.getElementById('typing').style.display=on?'block':'none';engine.thinking(!!on);clearTimeout(timer);if(on){bubble.textContent='…';bubble.setAttribute('aria-label','正在回复');bubble.style.display='block';}else bubble.removeAttribute('aria-label');}
function speak(text,preserve){if(!preserve)thinking(false);clearTimeout(timer);bubble.textContent=String(text).slice(0,1500);bubble.style.display='block';timer=setTimeout(()=>bubble.style.display='none',Math.max(6500,Math.min(30000,String(text).length*220)));}
async function load(p){payload=p;burstAt=0;burstCount=0;thinking(false);bubble.style.display='none';await engine.load(p.pack,p.binding);select.textContent='';for(const f of p.pack.forms){const o=document.createElement('option');o.value=f.id;o.textContent=f.name;select.appendChild(o);}select.value=engine.formId;document.getElementById('note').textContent='';started=true;}
select.onchange=()=>{engine.select(select.value);burstAt=0;burstCount=0;emit('form','',select.value);};
function open(){if(!payload?.binding.apiEnabled){speak('固定台词模式：在糯米机桌宠App开启API后可输入聊天。');return;}chat.style.display='flex';input.focus();}
document.getElementById('say').onclick=open;document.getElementById('hide').onclick=()=>bubble.style.display='none';document.getElementById('cancel').onclick=()=>{chat.style.display='none';input.blur();};chat.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;emit('text',input.value.trim());input.value='';chat.style.display='none';input.blur();};
const canvas=document.getElementById('pet');canvas.onpointerdown=e=>{down=[e.clientX,e.clientY];};canvas.onpointerup=e=>{if(!started||drag||!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>12)return;const at=Date.now();burstCount=at-burstAt<3000?Math.min(1000,burstCount+1):1;burstAt=at;engine.tap(burstCount);emit('tap');};
const baseWindowHeight=window.innerHeight;function viewportHeight(){const h=Math.ceil(Math.max(baseWindowHeight,(engine.requiredHeight||baseWindowHeight*.65)+baseWindowHeight*.35));bubble.style.top=Math.max(baseWindowHeight*.60,h-baseWindowHeight*.40)+'px';document.getElementById('typing').style.top=Math.max(baseWindowHeight*.57,h-baseWindowHeight*.43)+'px';return h;}
window.PetPreview={preset:text=>speak(text,true),setThinking:thinking,getLoadState:()=>loadState,apply:async p=>{loadState={revision:p.revision,status:'loading',error:''};try{await load(p);loadState={revision:p.revision,status:'ready',error:''};return true;}catch(e){loadState={revision:p.revision,status:'error',error:String(e.message||e)};speak('模型加载失败：'+e.message);document.getElementById('note').textContent='模型加载失败';return false;}},speak,getState:()=> (chat.style.display==='flex'?'1':'0')+'|'+viewportHeight(),popOutgoing:()=>out.shift()||null,setDragging:v=>{drag=!!v;engine.held(drag);},chooseForm:id=>{engine.select(id);select.value=engine.formId;},version:'2'};
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='tapnest-load')window.PetPreview.apply(e.data.payload);if(e.data?.type==='tapnest-speech')speak(e.data.text);});
parent!==window&&parent.postMessage({type:'tapnest-ready'},'*');
})();
</script></html>
