<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:system-ui;width:100%;height:100%;overflow:hidden;color:#315f43}#pet{display:block;width:100%;height:65%;touch-action:none}button,select,input{font:inherit;color:inherit;border:1px solid #caddce;border-radius:12px;background:#fbfffb;padding:9px;min-width:0;max-width:100%}button{cursor:pointer}button:active{background:#dcefe0}#bubble{position:absolute;top:60%;left:5%;width:90%;max-height:28%;overflow:auto;overflow-wrap:anywhere;border-radius:16px;background:#f6fff6ef;border:1px solid #bdd8c2;padding:10px;font-size:13px;white-space:pre-wrap;display:none}#typing{display:none;position:absolute;right:8%;top:57%;z-index:8;background:#eff9ee;border:1px solid #b5d6b8;border-radius:10px;padding:2px 10px}#note{position:absolute;top:4px;left:4px;font-size:11px;pointer-events:none}#activity{position:absolute;top:43%;left:42%;font-size:30px;pointer-events:none;display:none;animation:float 1s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-12px) rotate(8deg)}}
.sheet{display:none;position:fixed;inset:8px;z-index:20;flex-direction:column;min-height:0;overflow:hidden;border-radius:18px;background:#f5fbf6f7;border:1px solid #bdd8c2;box-shadow:0 5px 18px #234c3925;font-size:13px}.sheet header{display:flex;align-items:center;gap:6px;padding:9px;flex:none;border-bottom:1px solid #dce9df}.sheet header strong{flex:1;font-size:14px;min-width:0}.sheet header button{padding:5px 7px}.body{padding:10px;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1;display:flex;flex-direction:column;gap:9px}.body button,.body select{width:100%;flex:none;text-align:left}.body label{display:flex;flex-direction:column;gap:5px}.body p{margin:0;font-size:12px;line-height:1.6}.body input{width:100%;flex:none}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1;text-align:center}#chat .body{justify-content:flex-start}
</style><canvas id="pet"></canvas><div id="note">等待糯米机同步模型…</div><div id="bubble"></div><div id="typing" role="status" aria-label="正在回复">…</div><div id="activity" aria-hidden="true"></div>
<section id="menu" class="sheet" role="dialog" aria-modal="true" aria-label="桌宠设置"><header><button id="back" aria-label="返回上一级">‹</button><strong id="title">桌宠设置</strong><button id="closeMenu" aria-label="关闭设置">×</button></header><div id="menuBody" class="body"></div></section>
<form id="chat" class="sheet" aria-label="和桌宠聊天"><header><strong>说句话</strong><button type="button" id="cancel">收起</button></header><div class="body"><input id="message" maxlength="1000" placeholder="和角色说句话" autocomplete="off"><div class="row"><button type="submit">发送</button></div><p>发送后会显示“…”；继续戳动不会打断回复。</p></div></form>
<script src="engine.js"></script><script>
(function(){const canvas=document.getElementById('pet'),engine=TapNestEngine.make(canvas),out=[],bubble=document.getElementById('bubble'),chat=document.getElementById('chat'),input=document.getElementById('message'),menu=document.getElementById('menu'),body=document.getElementById('menuBody');let payload=null,timer,tapTimer,activityTimer,lastTap=0,burstAt=0,burstCount=0,started=false,drag=false,down,page='root',path=[],loadState={revision:'',status:'idle',error:''};
const baseWindowHeight=window.innerHeight;
function emit(kind,text,extra){if(!payload)return;const event={kind,text:text||'',formId:engine.formId,at:Date.now(),...(kind==='tap'?{tapCount:burstCount}:{}),...extra};out.push(event);if(out.length>25)out.shift();if(parent!==window)parent.postMessage({type:'tapnest-event',event},'*');}
function thinking(on){document.getElementById('typing').style.display=on?'block':'none';engine.thinking(!!on);clearTimeout(timer);if(on){bubble.textContent='…';bubble.setAttribute('aria-label','正在回复');bubble.style.display='block';}else bubble.removeAttribute('aria-label');}
function speak(text,preserve){if(!preserve)thinking(false);clearTimeout(timer);bubble.textContent=String(text).slice(0,1500);bubble.style.display='block';timer=setTimeout(()=>bubble.style.display='none',Math.max(6500,Math.min(30000,String(text).length*220)));}
function fit(){const height=Math.max(0,Math.min(window.innerHeight,window.visualViewport?.height||window.innerHeight)-16);for(const el of [menu,chat]){el.style.maxHeight=height+'px';el.style.bottom='auto';el.style.height=height+'px';}}
window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);fit();
function button(text,handler){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=handler;body.appendChild(b);return b;}
function info(text){const p=document.createElement('p');p.textContent=text;body.appendChild(p);}
function go(next){path.push(page);page=next;renderMenu();}
function dismiss(){menu.style.display='none';}
function action(kind,item,icon){dismiss();const el=document.getElementById('activity');el.textContent=icon;el.style.display='block';clearTimeout(activityTimer);activityTimer=setTimeout(()=>el.style.display='none',4500);emit(kind,item);}
function renderMenu(){body.textContent='';document.getElementById('back').style.visibility=path.length?'visible':'hidden';const names={root:'桌宠设置',forms:'切换形态',wardrobe:'更换配件',life:'生活互动',food:'选吃的',bath:'洗澡'};document.getElementById('title').textContent=names[page]||'选择配件';
if(page==='root'){button('切换形态',()=>go('forms'));button('更换配件',()=>go('wardrobe'));button('生活互动',()=>go('life'));button('收起对话气泡',()=>{bubble.style.display='none';dismiss();});}
else if(page==='forms'){for(const f of payload.pack.forms)button((f.id===engine.formId?'✓ ':'')+f.name,()=>{engine.select(f.id);burstAt=0;burstCount=0;emit('form','',{wardrobe:{}});renderMenu();});}
else if(page==='wardrobe'){const parts=engine.parts();if(!parts.length)info('这只桌宠还没有可更换的配件。请先在TapNest制作后重新导入。');for(const part of parts)button(part.label,()=>go('part:'+part.id));}
else if(page.startsWith('part:')){const id=page.slice(5),part=engine.parts().find(p=>p.id===id);document.getElementById('title').textContent=part?.label||'选择配件';const choose=source=>{try{const wardrobe=engine.choosePart(id,source);emit('wardrobe','',{wardrobe});renderMenu();}catch(e){info(e.message);}};const selected=engine.wardrobe[id]||engine.formId;button((selected===engine.formId?'✓ ':'')+'当前形态默认',()=>choose(''));button((selected==='none'?'✓ ':'')+'不佩戴',()=>choose('none'));for(const f of payload.pack.forms)if(f.id!==engine.formId&&f.rig.layers.some(l=>l.image&&TapNestEngine.math.category(l)===id))button((selected===f.id?'✓ ':'')+f.name,()=>choose(f.id));}
else if(page==='life'){button('吃东西',()=>go('food'));button('洗澡',()=>go('bath'));info(payload.binding.apiEnabled?'这些互动会带着事件说明请求角色API。':'当前只显示预设台词，不调用API。');}
else if(page==='food'){for(const [name,icon]of [['米饭','🍚'],['小蛋糕','🍰'],['水果','🍎'],['饼干','🍪'],['饮水','💧']])button(icon+' '+name,()=>action('feed',name,icon));}
else if(page==='bath'){info('给桌宠洗个温水澡。');button('🛁 开始洗澡',()=>action('bath','温水洗澡','🫧'));}
fit();}
function showSettings(){if(!started)return;clearTimeout(tapTimer);lastTap=0;chat.style.display='none';input.blur();page='root';path=[];menu.style.display='flex';renderMenu();}
document.getElementById('back').onclick=()=>{page=path.pop()||'root';renderMenu();};document.getElementById('closeMenu').onclick=dismiss;
function openChat(){dismiss();if(!payload?.binding.apiEnabled){speak('当前是预设模式；开启API后可双击输入。');return;}chat.style.display='flex';fit();input.focus();}
document.getElementById('cancel').onclick=()=>{chat.style.display='none';input.blur();};chat.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;emit('text',input.value.trim());input.value='';chat.style.display='none';input.blur();};
async function load(p){payload=p;started=false;clearTimeout(tapTimer);lastTap=0;burstAt=0;burstCount=0;thinking(false);bubble.style.display='none';await engine.load(p.pack,p.binding);if(payload!==p)return false;document.getElementById('note').textContent='';started=true;if(menu.style.display==='flex')renderMenu();return true;}
function poke(at){burstCount=at-burstAt<3000?Math.min(1000,burstCount+1):1;burstAt=at;engine.tap(burstCount);emit('tap');}
canvas.onpointerdown=e=>{down={x:e.clientX,y:e.clientY,at:Date.now(),moved:false};};canvas.onpointermove=e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)down.moved=true;};canvas.onpointercancel=()=>{down=null;};canvas.onpointerup=e=>{const press=down;down=null;if(!started||drag||!press||press.moved||Math.hypot(e.clientX-press.x,e.clientY-press.y)>12)return;const at=Date.now(),held=at-press.at;if(held>=5000)return;if(held>=1000){showSettings();return;}if(lastTap&&at-lastTap<300){clearTimeout(tapTimer);lastTap=0;openChat();return;}lastTap=at;tapTimer=setTimeout(()=>{if(lastTap!==at)return;lastTap=0;poke(at);},300);};
function viewportHeight(){const h=Math.ceil(Math.max(baseWindowHeight,(engine.requiredHeight||baseWindowHeight*.65)+baseWindowHeight*.35));bubble.style.top=Math.max(baseWindowHeight*.60,h-baseWindowHeight*.40)+'px';document.getElementById('typing').style.top=Math.max(baseWindowHeight*.57,h-baseWindowHeight*.43)+'px';return h;}
window.PetPreview={preset:text=>speak(text,true),setThinking:thinking,showSettings,getLoadState:()=>loadState,apply:async p=>{loadState={revision:p.revision,status:'loading',error:''};try{if(!await load(p))return false;loadState={revision:p.revision,status:'ready',error:''};return true;}catch(e){if(payload!==p)return false;loadState={revision:p.revision,status:'error',error:String(e.message||e)};speak('模型加载失败：'+e.message);document.getElementById('note').textContent='模型加载失败';return false;}},speak,getState:()=> (chat.style.display==='flex'?'1':'0')+'|'+viewportHeight()+'|'+(menu.style.display==='flex'?'1':'0'),popOutgoing:()=>out.shift()||null,setDragging:v=>{drag=!!v;if(drag){clearTimeout(tapTimer);lastTap=0;}engine.held(drag);},chooseForm:id=>{engine.select(id);},version:'2'};
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='tapnest-load')window.PetPreview.apply(e.data.payload);if(e.data?.type==='tapnest-speech')speak(e.data.text);});if(parent!==window)parent.postMessage({type:'tapnest-ready'},'*');
})();
</script></html>
