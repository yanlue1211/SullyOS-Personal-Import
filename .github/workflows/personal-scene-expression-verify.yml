name: Personal scene expression prompt compatibility

on:
  push:
    branches: [personal/shared-scene-expression-20261117]
  pull_request:
    branches: [personal/audio-listening]
    paths:
      - 'utils/chatPromptPreferences.ts'
      - 'utils/datePrompts.ts'
      - 'components/date/story/StoryTheaterSession.tsx'
      - 'assets/presets/night-screening-v6.14.sully.json'
      - 'utils/chatPromptPreferences.test.ts'
      - 'utils/datePrompts.test.ts'
      - 'utils/storyTheater.test.ts'
      - '.github/workflows/personal-scene-expression-verify.yml'

permissions:
  contents: read

jobs:
  verify-scene-expression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run focused chat, Date and Theater prompt tests
        run: pnpm exec vitest run utils/chatPromptPreferences.test.ts utils/datePrompts.test.ts utils/storyTheater.test.ts
      - name: Verify production build
        run: pnpm build
