name: Response status and scheduling compatibility
on:
  push:
    branches: [personal/status-scheduling]
  pull_request:
    branches: [personal/audio-listening]
    paths: ['features/personal/responseStatus/**', 'utils/responseStatus*', 'utils/chatParser.ts', 'utils/applyAssistantPostProcessing*', '.github/workflows/status-scheduling-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/localScheduleReplay.test.ts utils/messageDeliveryDurability.test.ts utils/personalBackupAudit.test.ts utils/responseStatus.test.ts utils/responseStatusUI.test.ts utils/applyAssistantPostProcessing.test.ts utils/chatParser.scheduleMessage.test.ts utils/chatPrompts.firePack.test.ts utils/amsg2ToolBridge.test.ts utils/amsg2ToolLoop.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
      - name: Install browser tools
        run: |
          mkdir -p /tmp/status-browser-tools
          pnpm --dir /tmp/status-browser-tools add playwright@1.56.1
          node /tmp/status-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check local task UI at phone widths
        env:
          STATUS_PLAYWRIGHT_MODULE: /tmp/status-browser-tools/node_modules/playwright/index.mjs
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4183 > /tmp/status-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4183/test/fixtures/local-scheduled-browser.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/local-scheduled-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-scheduled-screens
          path: test-results/local-scheduled
