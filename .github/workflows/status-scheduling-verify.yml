name: Response status and scheduling compatibility
on:
  push:
    branches: [personal/status-scheduling]
  pull_request:
    branches: [personal/audio-listening]
    paths: ['features/personal/responseStatus/**', 'utils/responseStatus*', 'utils/chatParser.ts', 'utils/applyAssistantPostProcessing*', '.github/workflows/status-scheduling-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/responseStatus.test.ts utils/responseStatusUI.test.ts utils/applyAssistantPostProcessing.test.ts utils/chatParser.scheduleMessage.test.ts utils/chatPrompts.firePack.test.ts utils/amsg2ToolBridge.test.ts utils/amsg2ToolLoop.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
