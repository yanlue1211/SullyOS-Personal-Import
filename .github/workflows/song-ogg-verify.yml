name: Song audio format compatibility
on:
  push:
    branches: [fix/song-ogg-recognition]
  pull_request:
    branches: [personal/audio-listening]
    paths: ['utils/songAudioConversion*', 'utils/audioApi.ts', 'utils/songListening.ts', 'features/personal/songArchive/reanalysis.ts', 'scripts/song-ogg-browser-check.mjs', 'test/fixtures/song-ogg-browser*', 'test/fixtures/audio/recognition-tone.ogg', '.github/workflows/song-ogg-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/songAudioConversion.test.ts utils/songAudioTransport.test.ts utils/importedLyrics.test.ts utils/personalAudioProtocol.test.ts utils/audioApiFields.test.ts utils/yueqiRecording.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
      - run: |
          mkdir -p /tmp/song-browser
          pnpm --dir /tmp/song-browser add playwright@1.56.1
          node /tmp/song-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify real OGG decoding and outgoing WAV request
        env:
          SONG_PLAYWRIGHT_MODULE: /tmp/song-browser/node_modules/playwright/index.mjs
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4185 > /tmp/song-vite.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4185/test/fixtures/song-ogg-browser.html > /dev/null && break; sleep 1; done
          node scripts/song-ogg-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-ogg-browser-proof
          path: test-results/song-ogg
