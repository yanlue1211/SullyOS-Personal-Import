name: All voice cleanup and storage recovery
on:
  push:
    branches: [feat/all-voice-cleanup]
  pull_request:
    branches: [personal/audio-listening]
    paths: ['utils/voiceCleanup*', 'utils/lsMirror*', 'features/personal/chatMedia/cleanup.ts', 'components/settings/VoiceCleanupPanel.tsx', 'components/settings/StorageUsagePanel.tsx', '.github/workflows/voice-cleanup-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/voiceCleanup.test.ts utils/voiceCleanupUI.test.tsx utils/personalRecordingCleanup.test.ts utils/lsMirror.test.ts utils/databaseStartup.test.ts utils/databaseGuard.test.ts utils/voiceFavorites.test.ts utils/voiceMessageBackup.test.ts utils/yueqiRuntime.test.ts utils/yueqi.test.ts utils/personalBackupAudit.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
