name: Melody composer prototype checks
on:
  push:
    branches: [personal/songwriting-melody-abcjs-prototype-20261116]
  pull_request:
    paths:
      - 'features/songwriting/melody.ts'
      - 'components/song/MelodyPanel.tsx'
      - 'components/song/MelodyPanel.css'
      - 'utils/audioApi.ts'
      - 'utils/songwritingMelody.test.ts'
      - '.github/workflows/songwriting-melody-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/songwritingMelody.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
