name: Personal theater manual summary checks
on:
  pull_request:
    paths:
      - 'components/date/story/**'
      - 'utils/storyTheater*'
      - 'types.ts'
      - '.github/workflows/personal-theater-manual-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify manual theater summary, original summaries and story contexts
        run: pnpm exec vitest run utils/storyTheaterManualArchive.test.ts utils/storyTheaterArchive.test.ts utils/storyTheater.test.ts utils/storyTheaterReply.test.ts
      - name: Build front-end and Worker without paid API requests
        run: pnpm run build
