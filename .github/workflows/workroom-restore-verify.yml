name: Workroom deleted share restore
on:
  push:
    branches: [fix/workroom-deleted-share-restore]
  pull_request:
    branches: [personal/audio-listening]
    paths: ['features/workroom/backup.ts', 'utils/workroomCollaboration.test.ts', '.github/workflows/workroom-restore-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run utils/workroomCollaboration.test.ts utils/workroomStorage.test.ts utils/workroomEvent.test.ts utils/workroomDelivery.test.ts utils/workroomPortable.test.ts utils/workroomNarration.test.ts utils/workroomRuntime.test.ts utils/personalBackupAudit.test.ts utils/activityBackup.test.ts utils/sarReleaseBackup.test.ts --maxWorkers=2 --minWorkers=1
      - run: pnpm build
