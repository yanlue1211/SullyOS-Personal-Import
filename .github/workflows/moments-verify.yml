name: Private Moments verification
on:
  push:
    branches: [personal/moments-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Private Moments and public-account boundaries
        run: pnpm vitest run utils/moments.test.ts utils/momentsRuntime.test.ts utils/momentsMemory.test.ts utils/momentsUI.test.tsx utils/momentsScheduler.test.tsx utils/friendFeedPublicFigure.test.ts utils/chatCardLongPress.test.tsx utils/yueqiText.test.ts utils/minimaxTts.voice.test.ts utils/yueqiContext.test.ts utils/yueqiRuntime.test.ts utils/yueqiUI.test.tsx --maxWorkers=2 --minWorkers=1
      - name: Shared chat, public feed, memory and backup regressions
        run: pnpm vitest run utils/friendFeedApp.test.ts utils/friendFeedGraph.test.ts utils/friendFeedSocial.test.ts utils/friendFeedEmotion.test.ts utils/activityBackup.test.ts utils/backupFormat.test.ts utils/contextWorldbook.test.ts utils/chatRequestPayload.test.ts utils/memoryPalace/innerVoiceMemory.test.ts utils/workroomStorage.test.ts --maxWorkers=2 --minWorkers=1
      - name: Build
        run: pnpm run build
      - name: Install isolated browser runtime
        run: |
          mkdir -p "$RUNNER_TEMP/moments-browser"
          pnpm --dir "$RUNNER_TEMP/moments-browser" add playwright@1.56.1
          pnpm --dir "$RUNNER_TEMP/moments-browser" exec playwright install --with-deps chromium
      - name: Browser verification
        env:
          MOMENTS_BROWSER_MODULE: ${{ runner.temp }}/moments-browser/node_modules/playwright/index.mjs
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4188 > /tmp/moments-vite.log 2>&1 &
          node scripts/test-moments-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moments-browser-screenshots
          path: /tmp/moments-browser
          if-no-files-found: ignore
