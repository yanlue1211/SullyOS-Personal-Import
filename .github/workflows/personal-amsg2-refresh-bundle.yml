name: Temporary personal amsg2 bundle sync
on:
  push:
    branches:
      - personal/amsg2-away-guard-upstream-20261107
    paths:
      - .github/workflows/personal-amsg2-refresh-bundle.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-workers.mjs
      - name: Commit only regenerated Worker bundle to test branch
        run: |
          if git diff --quiet -- worker/amsg/worker.bundle.js; then
            echo "Worker bundle already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/amsg/worker.bundle.js
          git commit -m 'build(amsg): regenerate worker bundle after reply scope fixes'
          git push origin HEAD:personal/amsg2-away-guard-upstream-20261107
